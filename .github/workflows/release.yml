name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: sh scripts/test.sh
      - name: Build debug binary for the end-to-end run
        run: swift build
      - name: End-to-end conversions
        run: sh scripts/e2e.sh

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app
        run: sh scripts/build-app.sh "${GITHUB_REF_NAME#v}"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Whorl.zip
            dist/Whorl.zip.sha256
          generate_release_notes: true
